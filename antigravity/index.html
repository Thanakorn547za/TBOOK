<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกข้อมูลนักศึกษา | Student Data Recorder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-user-graduate"></i> บันทึกข้อมูลนักศึกษา</h1>
            <p>ระบบจัดการฐานข้อมูลนักศึกษาด้วย LocalStorage</p>
        </header>

        <main>
            <section class="glass-card form-section">
                <h2><i class="fa-solid fa-plus-circle"></i> เพิ่มข้อมูลนักศึกษา</h2>
                <form id="studentForm">
                    <div class="form-group">
                        <label for="studentId">รหัสนักศึกษา</label>
                        <input type="text" id="studentId" placeholder="เช่น 640001" required>
                    </div>
                    <div class="form-group">
                        <label for="fullName">ชื่อ-นามสกุล</label>
                        <input type="text" id="fullName" placeholder="เช่น สมชาย ใจดี" required>
                    </div>
                    <div class="form-group">
                        <label for="major">สาขาวิชา</label>
                        <select id="major" required>
                            <option value="" disabled selected>เลือกสาขาวิชา</option>
                            <option value="วิทยาการคอมพิวเตอร์">วิทยาการคอมพิวเตอร์</option>
                            <option value="เทคโนโลยีสารสนเทศ">เทคโนโลยีสารสนเทศ</option>
                            <option value="วิศวกรรมซอฟต์แวร์">วิศวกรรมซอฟต์แวร์</option>
                            <option value="นิเทศศาสตร์">นิเทศศาสตร์</option>
                            <option value="บริหารธุรกิจ">บริหารธุรกิจ</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="gpa">เกรดเฉลี่ย (GPA)</label>
                        <input type="number" id="gpa" step="0.01" min="0" max="4.00" placeholder="0.00 - 4.00" required>
                    </div>
                    <button type="submit" class="btn-primary"><i class="fa-solid fa-save"></i> บันทึกข้อมูล</button>
                </form>
            </section>

            <section class="glass-card table-section">
                <div class="table-header">
                    <h2><i class="fa-solid fa-list"></i> รายชื่อนักศึกษา</h2>
                    <div class="search-box">
                        <i class="fa-solid fa-search"></i>
                        <input type="text" id="searchInput" placeholder="ค้นหาชื่อ หรือรหัสนักศึกษา...">
                    </div>
                </div>
                <div class="table-responsive">
                    <table id="studentTable">
                        <thead>
                            <tr>
                                <th>รหัสนักศึกษา</th>
                                <th>ชื่อ-นามสกุล</th>
                                <th>สาขาวิชา</th>
                                <th>GPA</th>
                                <th>จัดการ</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Data will be populated here -->
                        </tbody>
                    </table>
                    <div id="noData" class="no-data" style="display: none;">
                        <i class="fa-solid fa-folder-open"></i>
                        <p>ไม่พบข้อมูลนักศึกษา</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
